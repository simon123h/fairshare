[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairshare-cli"
version = "0.1.0"
description = "Ein einfaches Python-Tool zum fairen Aufteilen von Kosten."
authors = [
    { name = "Simon", email = "simon@example.com" }
]
dependencies = [
    "PyYAML>=6.0.1",
    "ruff>=0.4.0",
]
requires-python = ">=3.8"

[project.scripts]
fairshare = "run:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
