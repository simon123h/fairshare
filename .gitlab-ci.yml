stages:
  - lint
  - test
  - build

image: python:3.12

cache:
  paths:
    - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BINARY_NAME: "fairshare-linux"

before_script:
  - python --version
  - pip install -r requirements.txt
  - pip install ruff mypy types-PyYAML pyinstaller

ruff-lint:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .
  allow_failure: false

mypy-typecheck:
  stage: lint
  script:
    - mypy .
  allow_failure: false

unit-tests:
  stage: test
  script:
    - coverage run -m unittest discover tests
    - coverage report -m
    - coverage xml
  coverage: '/TOTAL.*\s+(\d+%) /'
  artifacts:
    when: always
    paths:
      - coverage.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build-job:
  stage: build
  script:
    - pyinstaller fairshare.spec
    - mv dist/fairshare $BINARY_NAME
  artifacts:
    paths:
      - $BINARY_NAME
  only:
    - tags

release-job:
  stage: build
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-job
      artifacts: true
  only:
    - tags
  before_script:
    - "" # Clear global before_script
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release created from GitLab CI/CD'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: '$BINARY_NAME'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${GE_JOB_ID}/artifacts/raw/${BINARY_NAME}'
          # Note: GE_JOB_ID might need to be passed or use a fixed link if using generic packages
