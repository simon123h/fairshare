stages:
  - lint
  - test

image: python:3.12

# Cache für pip-Pakete, um die Pipeline zu beschleunigen
cache:
  paths:
    - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

before_script:
  - python --version
  - pip install -r requirements.txt
  - pip install ruff

# Stage: Linting & Formatting
ruff-lint:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .
  allow_failure: false

# Stage: Unit Tests
unit-tests:
  stage: test
  script:
    - coverage run -m unittest discover tests
    - coverage report -m
    - coverage xml
  coverage: '/TOTAL.*\s+(\d+%) /'
  artifacts:
    when: always
    paths:
      - coverage.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
